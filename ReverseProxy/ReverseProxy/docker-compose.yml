services:
  redis:
    image: redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: gatekeeper-postgres
    environment:
      POSTGRES_DB: Gateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: udaradeadshot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gatekeeper-gateway
    ports:
      - "7097:7097"
      - "80:80"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=Gateway;Username=postgres;Password=udaradeadshot
      - ConnectionStrings__Redis=redis:6379
      - Routes__0__Path=/products
      - Routes__0__Target=http://product-api:8080/api/Product/get
    depends_on:
      - postgres
      - redis

volumes:
  pgdata: